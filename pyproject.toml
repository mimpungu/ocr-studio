[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-studio"
version = "0.1.0"
description = "Outil OCR privé avancé avec post-traitement haute précision, éditeur interactif côte à côte et exports multi-formats"
authors = [{ name = "Deo Mimpungu" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "indra-ocr>=1.1.2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "python-docx>=1.1",
  "reportlab>=4.2",
  "pillow>=10.0",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pypdfium2>=4.30",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
ocr-studio = "ocr_studio.server:main"

[tool.setuptools]
packages = ["ocr_studio"]
